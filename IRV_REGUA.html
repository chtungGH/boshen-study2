<!DOCTYPE html>
<html lang="zh-TW" class="min-h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Irregular Verbs - 英語不規則動詞分級特訓站</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }

    /* 現代扁平按鈕 */
    .app-btn {
      transition: all 0.15s ease-in-out;
      border: 1px solid #e2e8f0;
      background-color: #ffffff;
      color: #334155;
    }
    .app-btn:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }
    .app-btn:active {
      transform: scale(0.97);
    }
    .app-btn.active {
      background-color: #4f46e5;
      color: #ffffff;
      border-color: #4338ca;
      box-shadow: 0 1px 3px 0 rgba(79, 70, 229, 0.3);
    }
    .app-btn.active:hover {
      background-color: #4338ca;
    }

    /* 主操作按鈕 (Primary Indigo) */
    .app-btn-primary {
      background-color: #4f46e5;
      color: #ffffff;
      border: 1px solid #4338ca;
      box-shadow: 0 2px 4px rgba(79, 70, 229, 0.25);
      transition: all 0.15s ease;
    }
    .app-btn-primary:hover {
      background-color: #4338ca;
      box-shadow: 0 4px 6px rgba(79, 70, 229, 0.3);
    }
    .app-btn-primary:active {
      transform: scale(0.97);
    }

    /* 成功色按鈕 (Emerald) */
    .app-btn-success {
      background-color: #059669;
      color: #ffffff;
      border: 1px solid #047857;
      box-shadow: 0 2px 4px rgba(5, 150, 105, 0.25);
      transition: all 0.15s ease;
    }
    .app-btn-success:hover {
      background-color: #047857;
      box-shadow: 0 4px 6px rgba(5, 150, 105, 0.3);
    }
    .app-btn-success:active {
      transform: scale(0.97);
    }

    /* 卡片容器 */
    .app-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    /* 旋轉動畫 */
    @keyframes spin-normal {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-spin-custom {
      animation: spin-normal 1s linear infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col select-none antialiased bg-slate-50">

  <!-- 頂部導航列 (優化手機寬度配置) -->
  <header class="border-b border-slate-200 bg-white sticky top-0 z-40 shadow-sm">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 h-14 sm:h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2 sm:space-x-3 cursor-pointer shrink-0" onclick="playSound('click'); switchTab('quiz')">
        <div class="w-8 h-8 sm:w-10 sm:h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-sm">
          <i data-lucide="book-marked" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-xl font-bold tracking-tight text-slate-900 leading-none">Irregular Verbs</h1>
          <p class="text-[10px] sm:text-xs text-slate-500 font-medium mt-0.5">不規則動詞特訓</p>
        </div>
      </div>

      <div class="flex items-center space-x-1.5 sm:space-x-3">
        <!-- 雲端同步狀態小標籤 (手機隱藏或簡化) -->
        <div id="top-sync-status" class="hidden md:flex items-center space-x-1.5 px-2.5 py-1 bg-amber-50 border border-amber-200 text-amber-700 text-xs font-semibold rounded-full">
          <i data-lucide="refresh-cw" class="w-3 h-3 animate-spin-custom"></i>
          <span id="top-sync-text">連線中...</span>
        </div>

        <nav class="flex items-center space-x-1 sm:space-x-2">
          <button id="nav-btn-quiz" onclick="playSound('click'); switchTab('quiz')" class="app-btn active px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-base font-semibold flex items-center space-x-1 sm:space-x-2">
            <i data-lucide="pen-tool" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            <span>特訓場</span>
          </button>
          <button id="nav-btn-dictionary" onclick="playSound('click'); switchTab('dictionary')" class="app-btn px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-base font-semibold flex items-center space-x-1 sm:space-x-2">
            <i data-lucide="library" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            <span>圖鑑 (<span id="dict-total-count">...</span>)</span>
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- 主內容視窗 (移除鎖死居中與固定高，保證手機可順暢滑動) -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-6 pb-12 flex flex-col">

    <!-- 區塊 1: 測驗設定介面 -->
    <div id="section-setup" class="w-full max-w-2xl mx-auto space-y-4 sm:space-y-6">
      
      <!-- 雲端試算表連線提示卡 -->
      <div id="db-loading-banner" class="p-3.5 sm:p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-900 flex items-center justify-between shadow-sm transition-all">
        <div class="flex items-center space-x-2.5 sm:space-x-3">
          <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center shrink-0">
            <i id="db-status-icon" data-lucide="loader-2" class="w-4 h-4 sm:w-5 sm:h-5 animate-spin-custom"></i>
          </div>
          <div>
            <div id="db-loading-title" class="text-xs sm:text-base font-bold text-amber-900">正在與雲端 Google 試算表連線...</div>
            <div id="db-loading-desc" class="text-[11px] sm:text-xs text-amber-700">同步題庫中，完成後即可練習。</div>
          </div>
        </div>
        <button id="btn-manual-sync" onclick="playSound('click'); syncDataFromGAS(true)" class="app-btn px-2.5 py-1 text-xs font-semibold rounded-lg bg-white shrink-0">
          重新整理
        </button>
      </div>

      <div class="text-center space-y-1">
        <h2 class="text-xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">特訓設定與範圍選擇</h2>
        <p class="text-xs sm:text-sm text-slate-500 font-normal">結合真實語境例句，強化不規則動詞記憶</p>
      </div>

      <div class="app-card p-4 sm:p-8 space-y-5 sm:space-y-6">
        
        <!-- 1. 動詞單字範圍選擇 -->
        <div class="space-y-2">
          <label class="text-sm sm:text-base font-bold text-slate-800 flex items-center space-x-1.5">
            <span class="w-4 h-4 sm:w-5 sm:h-5 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center text-[11px] sm:text-xs">1</span>
            <span>選擇單字收錄範圍</span>
          </label>
          <div class="grid grid-cols-2 gap-2 sm:gap-3">
            <button type="button" onclick="playSound('click'); setScope('COMMON')" id="scope-btn-common" class="app-btn active py-2.5 sm:py-3 px-2 sm:px-4 rounded-xl text-xs sm:text-base font-bold flex items-center justify-center">
              <span id="scope-common-label">🔥 核心常用動詞</span>
            </button>
            <button type="button" onclick="playSound('click'); setScope('ALL')" id="scope-btn-all" class="app-btn py-2.5 sm:py-3 px-2 sm:px-4 rounded-xl text-xs sm:text-base font-bold flex items-center justify-center">
              <span id="scope-all-label">🌐 完整全收錄</span>
            </button>
          </div>
        </div>

        <!-- 2. 等級 1~5 聯集選擇 (手機端優化字級與內距) -->
        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label class="text-sm sm:text-base font-bold text-slate-800 flex items-center space-x-1.5">
              <span class="w-4 h-4 sm:w-5 sm:h-5 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center text-[11px] sm:text-xs">2</span>
              <span>例句難度等級</span>
            </label>
            <span id="selected-level-desc" class="text-[11px] sm:text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-2 py-0.5 rounded-full font-semibold">Lv.1 ~ Lv.5</span>
          </div>
          <div class="grid grid-cols-5 gap-1.5 sm:gap-2">
            <button type="button" onclick="playSound('click'); toggleLevelFilter(1)" id="level-btn-1" class="level-toggle-btn app-btn active py-2 rounded-xl flex flex-col items-center justify-center">
              <span class="text-xs sm:text-lg font-bold leading-tight">Lv.1</span>
              <span class="text-[10px] sm:text-sm font-medium opacity-90 mt-0.5">基礎</span>
            </button>
            <button type="button" onclick="playSound('click'); toggleLevelFilter(2)" id="level-btn-2" class="level-toggle-btn app-btn active py-2 rounded-xl flex flex-col items-center justify-center">
              <span class="text-xs sm:text-lg font-bold leading-tight">Lv.2</span>
              <span class="text-[10px] sm:text-sm font-medium opacity-90 mt-0.5">初級</span>
            </button>
            <button type="button" onclick="playSound('click'); toggleLevelFilter(3)" id="level-btn-3" class="level-toggle-btn app-btn active py-2 rounded-xl flex flex-col items-center justify-center">
              <span class="text-xs sm:text-lg font-bold leading-tight">Lv.3</span>
              <span class="text-[10px] sm:text-sm font-medium opacity-90 mt-0.5">中級</span>
            </button>
            <button type="button" onclick="playSound('click'); toggleLevelFilter(4)" id="level-btn-4" class="level-toggle-btn app-btn active py-2 rounded-xl flex flex-col items-center justify-center">
              <span class="text-xs sm:text-lg font-bold leading-tight">Lv.4</span>
              <span class="text-[10px] sm:text-sm font-medium opacity-90 mt-0.5">中高</span>
            </button>
            <button type="button" onclick="playSound('click'); toggleLevelFilter(5)" id="level-btn-5" class="level-toggle-btn app-btn active py-2 rounded-xl flex flex-col items-center justify-center">
              <span class="text-xs sm:text-lg font-bold leading-tight">Lv.5</span>
              <span class="text-[10px] sm:text-sm font-medium opacity-90 mt-0.5">高階</span>
            </button>
          </div>
          <div class="flex justify-end space-x-3 pt-0.5 text-xs font-semibold text-slate-500">
            <button type="button" onclick="playSound('click'); selectAllLevels(true)" class="hover:text-indigo-600">全選</button>
            <span>|</span>
            <button type="button" onclick="playSound('click'); selectAllLevels(false)" class="hover:text-rose-600">清空</button>
          </div>
        </div>

        <!-- 3. 動詞型態聯集多選 -->
        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label class="text-sm sm:text-base font-bold text-slate-800 flex items-center space-x-1.5">
              <span class="w-4 h-4 sm:w-5 sm:h-5 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center text-[11px] sm:text-xs">3</span>
              <span>變化型態</span>
            </label>
            <span id="selected-type-count" class="text-[11px] sm:text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded-full font-semibold">0 個動詞</span>
          </div>
          <div class="grid grid-cols-5 gap-1.5 sm:gap-2">
            <button type="button" onclick="playSound('click'); toggleTypeFilter('AAA')" id="type-btn-AAA" class="type-toggle-btn app-btn active py-2 rounded-xl text-xs sm:text-base font-bold">AAA</button>
            <button type="button" onclick="playSound('click'); toggleTypeFilter('AAB')" id="type-btn-AAB" class="type-toggle-btn app-btn active py-2 rounded-xl text-xs sm:text-base font-bold">AAB</button>
            <button type="button" onclick="playSound('click'); toggleTypeFilter('ABA')" id="type-btn-ABA" class="type-toggle-btn app-btn active py-2 rounded-xl text-xs sm:text-base font-bold">ABA</button>
            <button type="button" onclick="playSound('click'); toggleTypeFilter('ABB')" id="type-btn-ABB" class="type-toggle-btn app-btn active py-2 rounded-xl text-xs sm:text-base font-bold">ABB</button>
            <button type="button" onclick="playSound('click'); toggleTypeFilter('ABC')" id="type-btn-ABC" class="type-toggle-btn app-btn active py-2 rounded-xl text-xs sm:text-base font-bold">ABC</button>
          </div>
          <div class="flex justify-end space-x-3 pt-0.5 text-xs font-semibold text-slate-500">
            <button type="button" onclick="playSound('click'); selectAllTypes(true)" class="hover:text-indigo-600">全選</button>
            <span>|</span>
            <button type="button" onclick="playSound('click'); selectAllTypes(false)" class="hover:text-rose-600">清空</button>
          </div>
        </div>

        <!-- 4. 題型選擇 -->
        <div class="space-y-2">
          <label class="text-sm sm:text-base font-bold text-slate-800 flex items-center space-x-1.5">
            <span class="w-4 h-4 sm:w-5 sm:h-5 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center text-[11px] sm:text-xs">4</span>
            <span>測驗題型模式</span>
          </label>
          <div class="grid grid-cols-2 gap-2 sm:gap-3">
            <label class="app-btn p-3 sm:p-4 rounded-xl flex items-center cursor-pointer hover:border-indigo-300">
              <input type="radio" name="question-mode" value="MIXED" checked class="accent-indigo-600 w-4 h-4 shrink-0">
              <span class="ml-2 text-sm sm:text-lg font-bold text-slate-800">混合挑戰</span>
            </label>
            <label class="app-btn p-3 sm:p-4 rounded-xl flex items-center cursor-pointer hover:border-indigo-300">
              <input type="radio" name="question-mode" value="CHOICE" class="accent-indigo-600 w-4 h-4 shrink-0">
              <span class="ml-2 text-sm sm:text-lg font-bold text-slate-800">三態單選</span>
            </label>
            <label class="app-btn p-3 sm:p-4 rounded-xl flex items-center cursor-pointer hover:border-indigo-300">
              <input type="radio" name="question-mode" value="ERROR" class="accent-indigo-600 w-4 h-4 shrink-0">
              <span class="ml-2 text-sm sm:text-lg font-bold text-slate-800">例句改錯</span>
            </label>
            <label class="app-btn p-3 sm:p-4 rounded-xl flex items-center cursor-pointer hover:border-indigo-300">
              <input type="radio" name="question-mode" value="CLOZE" class="accent-indigo-600 w-4 h-4 shrink-0">
              <span class="ml-2 text-sm sm:text-lg font-bold text-slate-800">例句填空</span>
            </label>
          </div>
        </div>

        <!-- 5. 題數選擇 -->
        <div class="space-y-2">
          <label class="text-sm sm:text-base font-bold text-slate-800 flex items-center space-x-1.5">
            <span class="w-4 h-4 sm:w-5 sm:h-5 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center text-[11px] sm:text-xs">5</span>
            <span>題目數量</span>
          </label>
          <div class="grid grid-cols-4 gap-1.5 sm:gap-2">
            <button type="button" onclick="playSound('click'); setCount(10)" class="count-btn active app-btn py-2 sm:py-2.5 rounded-xl text-xs sm:text-base font-bold" data-count="10">10 題</button>
            <button type="button" onclick="playSound('click'); setCount(20)" class="count-btn app-btn py-2 sm:py-2.5 rounded-xl text-xs sm:text-base font-bold" data-count="20">20 題</button>
            <button type="button" onclick="playSound('click'); setCount(30)" class="count-btn app-btn py-2 sm:py-2.5 rounded-xl text-xs sm:text-base font-bold" data-count="30">30 題</button>
            <button type="button" onclick="playSound('click'); setCount(50)" class="count-btn app-btn py-2 sm:py-2.5 rounded-xl text-xs sm:text-base font-bold" data-count="50">50 題</button>
          </div>
        </div>

        <!-- 開始按鈕 -->
        <div class="pt-2">
          <button id="btn-start-quiz" onclick="playSound('levelup'); startQuiz()" class="w-full py-3.5 sm:py-4 app-btn-primary rounded-xl text-base sm:text-xl font-bold flex items-center justify-center space-x-2">
            <i data-lucide="play" class="w-4 h-4 sm:w-5 sm:h-5 fill-current"></i>
            <span id="btn-start-text">開始特訓作答</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 區塊 2: 進行中測驗 -->
    <div id="section-quiz" class="w-full max-w-3xl mx-auto hidden flex-col space-y-3 sm:space-y-4">
      <!-- 頂部資訊與進度條 -->
      <div class="app-card p-3.5 sm:p-5 space-y-2.5 sm:space-y-3">
        <div class="flex items-center justify-between text-xs sm:text-base font-bold">
          <div class="flex items-center space-x-1.5 sm:space-x-2">
            <span id="quiz-badge-type" class="bg-indigo-50 text-indigo-700 border border-indigo-200 px-2 sm:px-3 py-0.5 sm:py-1 rounded-full text-xs font-semibold">題型</span>
            <span id="quiz-badge-level" class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 sm:px-3 py-0.5 sm:py-1 rounded-full text-xs font-semibold">Lv.1</span>
            <span id="quiz-progress-text" class="text-slate-600 font-semibold ml-0.5">1 / 10</span>
          </div>
          <div class="flex items-center space-x-3 sm:space-x-4">
            <span class="flex items-center text-emerald-600 font-bold"><i data-lucide="check" class="w-3.5 h-3.5 mr-0.5"></i><span id="current-correct">0</span></span>
            <span class="flex items-center text-rose-500 font-bold"><i data-lucide="x" class="w-3.5 h-3.5 mr-0.5"></i><span id="current-wrong">0</span></span>
            <button onclick="playSound('click'); confirmExitQuiz()" class="text-slate-400 hover:text-slate-700 text-xs sm:text-sm font-medium underline">退出</button>
          </div>
        </div>
        
        <div class="w-full bg-slate-100 rounded-full h-2 sm:h-2.5 overflow-hidden">
          <div id="quiz-progress-bar" class="bg-indigo-600 h-full rounded-full transition-all duration-300" style="width: 10%"></div>
        </div>
      </div>

      <!-- 題目主卡片 -->
      <div id="question-card" class="app-card p-4 sm:p-8 space-y-5 sm:space-y-6">
        <div id="question-body"></div>

        <div id="feedback-container" class="hidden p-3.5 sm:p-5 rounded-xl border transition-all space-y-1.5 sm:space-y-2">
          <div class="flex items-center space-x-2 text-base sm:text-lg font-bold" id="feedback-title"></div>
          <div class="text-xs sm:text-base leading-relaxed" id="feedback-explanation"></div>
        </div>

        <div class="flex justify-end pt-1" id="action-buttons">
          <button id="btn-submit-answer" onclick="checkCurrentAnswer()" class="w-full sm:w-auto px-6 sm:px-8 py-3 sm:py-3.5 app-btn-primary rounded-xl text-base sm:text-lg font-bold">
            送出答案
          </button>
          <button id="btn-next-question" onclick="playSound('click'); nextQuestion()" class="hidden w-full sm:w-auto px-6 sm:px-8 py-3 sm:py-3.5 app-btn-success rounded-xl text-base sm:text-lg font-bold flex items-center justify-center space-x-2">
            <span>下一題</span>
            <i data-lucide="arrow-right" class="w-4 h-4 sm:w-5 sm:h-5"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- 區塊 3: 結算報告 -->
    <div id="section-result" class="w-full max-w-2xl mx-auto hidden flex-col space-y-4 sm:space-y-6">
      <div class="app-card p-5 sm:p-8 text-center space-y-5 sm:space-y-6">
        <div id="result-icon-wrapper" class="w-14 h-14 sm:w-16 sm:h-16 mx-auto rounded-2xl flex items-center justify-center bg-indigo-50 border border-indigo-200 text-indigo-600 shadow-sm">
          <i data-lucide="award" class="w-7 h-7 sm:w-8 sm:h-8"></i>
        </div>
        
        <div>
          <h2 class="text-xl sm:text-3xl font-bold text-slate-900 tracking-tight" id="result-title">測驗完成！成果結算</h2>
          <p class="text-xs sm:text-sm text-slate-500 mt-1" id="result-subtitle">以下為本次特訓的詳細答題統計</p>
        </div>

        <div class="grid grid-cols-3 gap-2 sm:gap-3 p-3 sm:p-4 bg-slate-50 border border-slate-200 rounded-xl">
          <div class="p-1 sm:p-2">
            <div class="text-[11px] sm:text-sm text-slate-500 font-medium">答對率</div>
            <div class="text-xl sm:text-3xl font-extrabold text-indigo-600 mt-0.5 sm:mt-1" id="result-score">0%</div>
          </div>
          <div class="p-1 sm:p-2 border-x border-slate-200">
            <div class="text-[11px] sm:text-sm text-slate-500 font-medium">答對題數</div>
            <div class="text-xl sm:text-3xl font-extrabold text-emerald-600 mt-0.5 sm:mt-1" id="result-correct-count">0</div>
          </div>
          <div class="p-1 sm:p-2">
            <div class="text-[11px] sm:text-sm text-slate-500 font-medium">答錯題數</div>
            <div class="text-xl sm:text-3xl font-extrabold text-rose-500 mt-0.5 sm:mt-1" id="result-wrong-count">0</div>
          </div>
        </div>

    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx && AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === 'click') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.04);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } else if (type === 'correct') {
        [523.25, 783.99].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.09);
          gain.gain.setValueAtTime(0.18, now + i * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.09);
          osc.stop(now + i * 0.09 + 0.25);
        });
      } else if (type === 'wrong') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.2);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'levelup') {
        [440, 554.37, 659.25, 880].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.15, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.35);
        });
      }
    }

    function setDbLoadingState(state, infoText = "") {
      const banner = document.getElementById('db-loading-banner');

      const desc = document.getElementById('db-loading-desc');

    async function syncDataFromGAS(isManual = false) {
      setDbLoadingState('loading');
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 12000);

        const response = await fetch(GAS_ENDPOINT_URL, { signal: controller.signal });
        clearTimeout(timeoutId);

        const result = await response.json();

        if (result.status === 'success' && Array.isArray(result.data) && result.data.length > 0) {
          VERB_DATABASE = result.data.map(item => {
            const ptList = [];
            const ppList = [];

            for (let lvl = 1; lvl <= 5; lvl++) {
              const ptSentence = item[`pt${lvl}`] || item[`PT例句${lvl}`] || (item.ptSentences && item.ptSentences[lvl - 1]?.sentence);
              const ppSentence = item[`pp${lvl}`] || item[`PP例句${lvl}`] || (item.ppSentences && item.ppSentences[lvl - 1]?.sentence);
              
              if (ptSentence) {
                ptList.push({
                  level: lvl,
                  sentence: ptSentence,
                  answer: item.past || item.PT
                });
              }
              if (ppSentence) {
                ppList.push({
                  level: lvl,
                  sentence: ppSentence,
                  answer: item.pp || item.PP
                });
              }
            }

            return {
              base: item.base || item['原型'],
              past: item.past || item.PT,
              pp: item.pp || item.PP,
              zh: item.zh || item['中文'],
              type: item.type || item['類型'],
              common: item.common !== undefined ? item.common : (item['核心／全收錄'] === '核心'),
              ptSentences: ptList.length > 0 ? ptList : (item.ptSentences || []),
              ppSentences: ppList.length > 0 ? ppList : (item.ppSentences || [])
            };
          });

          setDbLoadingState('success');
          updateFilterCount();
          renderDictionary();
        } else {
          throw new Error("回傳格式不符");
        }
      } catch (err) {
        console.warn("GAS 連線失敗，切換至備援資料庫:", err);
        setDbLoadingState('offline');
        updateFilterCount();
        renderDictionary();
      }
    }

      return VERB_DATABASE.filter(v => {
        const scopeMatch = currentScope === 'ALL' ? true : v.common;
        const typeMatch = selectedTypes.has(v.type);
        return scopeMatch && typeMatch;

    function updateFilterCount() {
      const pool = getFilteredVerbs();

    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function pickSentenceByLevel(sentenceList) {
      if (!sentenceList || sentenceList.length === 0) return null;
      const matched = sentenceList.filter(s => selectedLevels.has(s.level));
      if (matched.length > 0) {
        return matched[Math.floor(Math.random() * matched.length)];
      }
      return sentenceList[Math.floor(Math.random() * sentenceList.length)];
    }

    // ==========================================
    // 4. 題目產生邏輯
    // ==========================================
    function generateChoiceQuestion(verb) {
      const isPast = Math.random() > 0.45;
      const targetTense = isPast ? "過去式 (Past Tense)" : "過去分詞 (P.P.)";
      const correctAnswer = isPast ? verb.past : verb.pp;

      const distractors = new Set();
      if (verb.base + "ed" !== correctAnswer) distractors.add(verb.base + "ed");
      if (verb.base !== correctAnswer) distractors.add(verb.base);
      if (verb.past !== verb.pp) {
        const alt = isPast ? verb.pp : verb.past;
        if (alt !== correctAnswer) distractors.add(alt);
      }

      const others = shuffleArray(VERB_DATABASE.filter(v => v.base !== verb.base));
      for (const o of others) {
        if (distractors.size >= 3) break;
        const cand = isPast ? o.past : o.pp;
        if (cand && cand !== correctAnswer) distractors.add(cand);
      }

      const options = shuffleArray([correctAnswer, ...Array.from(distractors).slice(0, 3)]);

      return {
        type: 'CHOICE',
        typeName: '單選',
        level: Array.from(selectedLevels)[0] || 1,
        verb: verb,
        title: `選出動詞 <span class="text-indigo-600 font-bold underline">${verb.base}</span>（${verb.zh}）的【${targetTense}】：`,
        subText: `提示：注意動詞三態變化規則`,
        options: options,
        correctAnswer: correctAnswer,
        explanation: `<b>${verb.base}</b> 的變化為：原形 <code>${verb.base}</code> / 過去式 <code>${verb.past}</code> / 過去分詞 <code>${verb.pp}</code>。中文涵義為「${verb.zh}」。`
      };
    }

    function generateErrorQuestion(verb) {
      const isPast = Math.random() > 0.5;
      const sentenceList = (isPast ? verb.ptSentences : verb.ppSentences) || [];

      const sampleObj = pickSentenceByLevel(sentenceList);
      const chosenLevel = sampleObj ? sampleObj.level : 1;
      const correctAnswer = sampleObj ? sampleObj.answer : (isPast ? verb.past : verb.pp);

      let incorrectForm = verb.base + "ed";
      if (incorrectForm.toLowerCase() === correctAnswer.toLowerCase()) {
        incorrectForm = verb.base + "ing";
      }

      let rawSentence = sampleObj ? sampleObj.sentence : "The student (_____) the assignment.";
      
      const displaySentenceHtml = rawSentence.replace(
        /\([_]+\)/g, 
        `<span class="px-1.5 py-0.5 mx-1 bg-rose-50 border border-rose-300 text-rose-700 font-bold rounded underline decoration-wavy decoration-rose-500">${incorrectForm}</span>`
      );

      return {
        type: 'ERROR',
        typeName: '改錯',
        level: chosenLevel,
        verb: verb,
        title: `找出句子中【錯誤拼法】並輸入正確形式：`,
        subText: `依前後文時態填寫正確拼法`,
        displaySentence: displaySentenceHtml,
        wrongWord: incorrectForm,
        correctAnswer: correctAnswer,
        explanation: `句中「<code>${incorrectForm}</code>」為錯誤拼法。<br>正確句子：<b>${rawSentence.replace(/\([_]+\)/g, correctAnswer)}</b><br>動詞「${verb.base}（${verb.zh}）」：<code>${verb.base}</code> - <code>${verb.past}</code> - <code>${verb.pp}</code>。`
      };
    }

    function generateClozeQuestion(verb) {
      const isPast = Math.random() > 0.5;
      const sentenceList = (isPast ? verb.ptSentences : verb.ppSentences) || [];

      const sampleObj = pickSentenceByLevel(sentenceList);
      const chosenLevel = sampleObj ? sampleObj.level : 1;
      const correctAnswer = sampleObj ? sampleObj.answer : (isPast ? verb.past : verb.pp);
      let rawSentence = sampleObj ? sampleObj.sentence : "They (_____) very quickly.";

      const parts = rawSentence.split(/\([_]+\)/);
      const clozePre = parts[0] || "";
      const clozePost = parts.slice(1).join("") || "";

      return {
        type: 'CLOZE',
        typeName: '填空',
        level: chosenLevel,
        verb: verb,
        title: `閱讀上下文，在空格中填入正確動詞形式：`,
        subText: `動詞：<b class="text-indigo-600 underline">${verb.base}</b>（${verb.zh}）`,
        clozePre: clozePre,
        clozePost: clozePost,
        correctAnswer: correctAnswer,
        explanation: `完整句子：<b>${rawSentence.replace(/\([_]+\)/g, correctAnswer)}</b><br>動詞「${verb.base}」：<code>${verb.base}</code> / <code>${verb.past}</code> / <code>${verb.pp}</code>。`
      };
    }

    // ==========================================
    // 5. 測驗控制流程
    // ==========================================
    function startQuiz(customVerbs = null) {
      if (selectedLevels.size === 0) {
        alert("請至少選擇一個難度等級 (Lv. 1 ~ Lv. 5)！");
        return;
      }

      const pool = customVerbs || getFilteredVerbs();

      if (pool.length === 0) {
        alert("目前設定條件下沒有符合的動詞！請至少勾選一種變化型態。");
        return;
      }

      const mode = document.querySelector('input[name="question-mode"]:checked').value;
      const targetNum = Math.min(customVerbs ? customVerbs.length : selectedCount, pool.length);
      const chosenVerbs = shuffleArray(pool).slice(0, targetNum);

      quizQuestions = chosenVerbs.map(verb => {
        let questionType = mode;
        if (mode === 'MIXED') {
          const types = ['CHOICE', 'ERROR', 'CLOZE'];
          questionType = types[Math.floor(Math.random() * types.length)];
        }
        if (questionType === 'CHOICE') return generateChoiceQuestion(verb);
        if (questionType === 'ERROR') return generateErrorQuestion(verb);
        return generateClozeQuestion(verb);
      });

      currentIndex = 0;
      score = 0;
      wrongList = [];
      answeredCurrent = false;

      document.getElementById('section-setup').classList.add('hidden');
      document.getElementById('section-result').classList.add('hidden');
      document.getElementById('section-result').classList.remove('flex');
      document.getElementById('section-quiz').classList.remove('hidden');
      document.getElementById('section-quiz').classList.add('flex');

      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
      answeredCurrent = false;
      const q = quizQuestions[currentIndex];
      const total = quizQuestions.length;

      document.getElementById('quiz-progress-text').textContent = `${currentIndex + 1} / ${total}`;
      document.getElementById('quiz-progress-bar').style.width = `${((currentIndex + 1) / total) * 100}%`;
      document.getElementById('quiz-badge-type').textContent = q.typeName;
      
      const badgeLevel = document.getElementById('quiz-badge-level');
      if (badgeLevel) badgeLevel.textContent = `Lv.${q.level}`;

      document.getElementById('current-correct').textContent = score;
      document.getElementById('current-wrong').textContent = wrongList.length;

      document.getElementById('btn-submit-answer').classList.remove('hidden');
      document.getElementById('btn-next-question').classList.add('hidden');
      document.getElementById('feedback-container').classList.add('hidden');

      const body = document.getElementById('question-body');

      if (q.type === 'CHOICE') {
        body.innerHTML = `
          <div class="space-y-4">
            <div>
              <div class="text-lg sm:text-2xl font-bold leading-relaxed text-slate-900">${q.title}</div>
              <div class="text-xs sm:text-sm text-slate-500 mt-1">${q.subText}</div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3 pt-1">
              ${q.options.map((opt, i) => `
                <button type="button" onclick="selectOption('${opt}')" class="choice-opt-btn app-btn p-3.5 sm:p-4 rounded-xl text-left text-base sm:text-lg font-bold flex items-center justify-between" data-val="${opt}">
                  <span>(${String.fromCharCode(65 + i)}) ${opt}</span>
                  <span class="opt-indicator w-5 h-5 rounded-full border border-slate-300 flex items-center justify-center text-xs"></span>
                </button>
              `).join('')}
            </div>
            <input type="hidden" id="user-selected-val" value="">
          </div>
        `;
      } else if (q.type === 'ERROR') {
        body.innerHTML = `
          <div class="space-y-4">
            <div>
              <div class="text-lg sm:text-2xl font-bold text-slate-900">${q.title}</div>
              <div class="text-xs sm:text-sm text-slate-500 mt-1">${q.subText}</div>
            </div>
            <div class="p-3.5 sm:p-5 bg-slate-50 border border-slate-200 rounded-xl text-base sm:text-xl text-slate-800 leading-relaxed font-medium">
              ${q.displaySentence}
            </div>
            <div class="pt-1 space-y-2">
              <label class="block text-xs sm:text-sm font-bold text-slate-700">請在下方輸入正確動詞：</label>
              <input type="text" id="user-text-input" autofocus placeholder="輸入正確動詞..." class="w-full sm:w-80 px-3.5 py-2 sm:py-2.5 bg-white border border-slate-300 rounded-xl text-slate-900 font-bold text-base sm:text-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none shadow-sm">
            </div>
          </div>
        `;
      } else if (q.type === 'CLOZE') {
        body.innerHTML = `
          <div class="space-y-4">
            <div>
              <div class="text-lg sm:text-2xl font-bold text-slate-900">${q.title}</div>
              <div class="text-xs sm:text-sm text-slate-500 mt-1">${q.subText}</div>
            </div>
            <div class="p-3.5 sm:p-5 bg-slate-50 border border-slate-200 rounded-xl text-base sm:text-xl text-slate-800 leading-loose font-medium">
              ${q.clozePre}
              <input type="text" id="user-text-input" autofocus placeholder="填入形式" class="inline-block mx-1 px-2 py-0.5 bg-white border-b-2 border-indigo-600 font-bold text-indigo-700 w-32 sm:w-44 text-center focus:outline-none">
              ${q.clozePost}
            </div>
          </div>
        `;
      }

      const textInput = document.getElementById('user-text-input');
      if (textInput) {
        textInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            if (!answeredCurrent) checkCurrentAnswer();
            else nextQuestion();
          }
        });
      }

      lucide.createIcons();
    }

    function selectOption(val) {
      if (answeredCurrent) return;
      playSound('click');
      document.getElementById('user-selected-val').value = val;
      document.querySelectorAll('.choice-opt-btn').forEach(btn => {
        if (btn.dataset.val === val) {
          btn.classList.add('active');
          btn.querySelector('.opt-indicator').innerHTML = '✓';
          btn.querySelector('.opt-indicator').className = 'opt-indicator w-5 h-5 rounded-full bg-white text-indigo-600 flex items-center justify-center text-xs font-bold';
        } else {
          btn.classList.remove('active');
          btn.querySelector('.opt-indicator').innerHTML = '';
          btn.querySelector('.opt-indicator').className = 'opt-indicator w-5 h-5 rounded-full border border-slate-300 flex items-center justify-center text-xs';
        }
      });
    }

    function checkCurrentAnswer() {
      if (answeredCurrent) return;

      const q = quizQuestions[currentIndex];
      let userAns = "";

      if (q.type === 'CHOICE') {
        userAns = document.getElementById('user-selected-val').value.trim();
        if (!userAns) return;
      } else {
        const inp = document.getElementById('user-text-input');
        userAns = inp ? inp.value.trim().toLowerCase() : "";
        if (!userAns) return;
      }

      answeredCurrent = true;
      const isCorrect = userAns.toLowerCase() === q.correctAnswer.toLowerCase();

      const feedbackBox = document.getElementById('feedback-container');
      const feedbackTitle = document.getElementById('feedback-title');
      const feedbackExp = document.getElementById('feedback-explanation');

      feedbackBox.classList.remove('hidden');

      if (isCorrect) {
        score++;
        playSound('correct');
        feedbackBox.className = "p-3.5 sm:p-5 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-900";
        feedbackTitle.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4 sm:w-5 sm:h-5 text-emerald-600 inline"></i> <span class="text-emerald-800">回答正確！</span>`;
      } else {
        wrongList.push({ question: q, userAns: userAns });
        playSound('wrong');
        feedbackBox.className = "p-3.5 sm:p-5 rounded-xl border border-rose-200 bg-rose-50 text-rose-900";
        feedbackTitle.innerHTML = `<i data-lucide="x-circle" class="w-4 h-4 sm:w-5 sm:h-5 text-rose-600 inline"></i> <span class="text-rose-800">回答錯誤，正解為：<b class="underline">${q.correctAnswer}</b></span>`;
      }

      feedbackExp.innerHTML = q.explanation;
      lucide.createIcons();

      document.getElementById('btn-submit-answer').classList.add('hidden');
      document.getElementById('btn-next-question').classList.remove('hidden');
    }

    function nextQuestion() {
      if (currentIndex < quizQuestions.length - 1) {
        currentIndex++;
        renderCurrentQuestion();
      } else {
        showResults();
      }
    }

    function retryWrongQuestions() {
      if (!wrongList || wrongList.length === 0) return;
      const wrongVerbs = wrongList.map(item => item.question.verb);
      startQuiz(wrongVerbs);
    }

    function resetToSetup() {
      document.getElementById('section-quiz').classList.add('hidden');
      document.getElementById('section-quiz').classList.remove('flex');
      document.getElementById('section-result').classList.add('hidden');
      document.getElementById('section-result').classList.remove('flex');
      document.getElementById('section-setup').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function confirmExitQuiz() {
      if (confirm("確定要放棄目前的測驗進度並返回設定頁嗎？")) {
        resetToSetup();
      }
    }

    function showResults() {
      playSound('levelup');
      document.getElementById('section-quiz').classList.add('hidden');
      document.getElementById('section-quiz').classList.remove('flex');
      document.getElementById('section-result').classList.remove('hidden');
      document.getElementById('section-result').classList.add('flex');

      const total = quizQuestions.length;
      const rate = Math.round((score / total) * 100);

      document.getElementById('result-score').textContent = `${rate}%`;
      document.getElementById('result-correct-count').textContent = score;
      document.getElementById('result-wrong-count').textContent = wrongList.length;

      const titleEl = document.getElementById('result-title');
      if (rate >= 90) titleEl.textContent = "表現極佳！完全精通！";
      else if (rate >= 60) titleEl.textContent = "表現不錯！持之以恆！";
      else titleEl.textContent = "再接再厲，多加練習！";

      const wrongContainer = document.getElementById('wrong-answers-container');
      const retryWrongBtn = document.getElementById('btn-retry-wrong');

      if (wrongList.length > 0) {
        retryWrongBtn.classList.remove('hidden');
        retryWrongBtn.classList.add('flex');
        document.getElementById('wrong-retry-count').textContent = wrongList.length;

        wrongContainer.innerHTML = `
          <div class="text-xs sm:text-sm font-bold text-slate-700 flex items-center mb-1">
            <i data-lucide="alert-circle" class="w-4 h-4 mr-1 text-rose-500"></i>
            本次錯題檢視 (${wrongList.length} 題)：
          </div>
          <div class="space-y-2 max-h-52 overflow-y-auto pr-1">
            ${wrongList.map(item => `
              <div class="p-2.5 sm:p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs sm:text-sm flex justify-between items-center font-medium">
                <div>
                  <span class="font-bold text-slate-900">${item.question.verb.base} (${item.question.verb.zh})</span>
                  <span class="text-[10px] bg-slate-200 text-slate-700 px-1 py-0.2 rounded ml-1">Lv.${item.question.level}</span>
                  <div class="text-slate-500 text-xs mt-0.5">你的回答: <span class="text-rose-500 line-through">${item.userAns || "(未作答)"}</span></div>
                </div>
                <div class="text-emerald-600 font-bold shrink-0 text-right">正解: ${item.question.correctAnswer}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else {
        retryWrongBtn.classList.add('hidden');
        wrongContainer.innerHTML = `<div class="p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-800 font-bold text-center text-xs sm:text-sm">恭喜全部答對！沒有任何錯題記錄！</div>`;
      }
      lucide.createIcons();
    }

    // ==========================================
    // 6. 圖鑑展示與頁籤切換
    // ==========================================
    function switchTab(tab) {
      if (tab === 'quiz') {
        document.getElementById('section-dictionary').classList.add('hidden');
        document.getElementById('section-dictionary').classList.remove('flex');
        document.getElementById('section-setup').classList.remove('hidden');
        document.getElementById('nav-btn-quiz').classList.add('active');
        document.getElementById('nav-btn-dictionary').classList.remove('active');
      } else if (tab === 'dictionary') {
        document.getElementById('section-setup').classList.add('hidden');
        document.getElementById('section-quiz').classList.add('hidden');
        document.getElementById('section-result').classList.add('hidden');
        document.getElementById('section-dictionary').classList.remove('hidden');
        document.getElementById('section-dictionary').classList.add('flex');
        document.getElementById('nav-btn-quiz').classList.remove('active');
        document.getElementById('nav-btn-dictionary').classList.add('active');
        renderDictionary();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setDictFilter(type) {
      dictCurrentType = type;
      document.querySelectorAll('.dict-filter').forEach(btn => {
        if (btn.dataset.dict === type) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      renderDictionary();
    }

    function renderDictionary() {
      const searchKey = (document.getElementById('dict-search-input')?.value || "").toLowerCase().trim();
      const tbody = document.getElementById('dict-table-body');
      if (!tbody) return;

      const filtered = VERB_DATABASE.filter(v => {
        const matchesScope = dictCurrentScope === 'ALL' ? true : v.common;
        const matchesType = dictCurrentType === 'ALL' || v.type === dictCurrentType;
        const matchesSearch = !searchKey || 
          v.base.toLowerCase().includes(searchKey) ||
          v.past.toLowerCase().includes(searchKey) ||
          v.pp.toLowerCase().includes(searchKey) ||
          v.zh.toLowerCase().includes(searchKey);

        return matchesScope && matchesType && matchesSearch;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-500 font-medium text-xs">無符合條件的動詞</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((v, idx) => {
        return `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="py-2.5 px-3 sm:px-4 text-center text-slate-400 text-xs">${idx + 1}</td>
            <td class="py-2.5 px-3 sm:px-4 text-slate-900 font-bold flex items-center space-x-1">
              <span>${v.base}</span>
              ${v.common ? '<span class="text-[10px] bg-amber-50 text-amber-700 border border-amber-200 px-1 py-0.2 rounded font-semibold">核心</span>' : ''}
            </td>
            <td class="py-2.5 px-3 sm:px-4 text-indigo-700 font-semibold">${v.past}</td>
            <td class="py-2.5 px-3 sm:px-4 text-emerald-700 font-semibold">${v.pp}</td>
            <td class="py-2.5 px-3 sm:px-4 text-slate-600">${v.zh}</td>
            <td class="py-2.5 px-3 sm:px-4 text-center"><span class="bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded text-[11px] font-semibold">${v.type}</span></td>
          </tr>
        `;
      }).join('');
    }

    // 頁面初始化
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updateFilterCount();
      updateLevelBadge();
      syncDataFromGAS();
    });
  </script>
</body>
</html>

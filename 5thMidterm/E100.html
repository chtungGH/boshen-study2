<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小五年級英語期中評量（100題挑戰）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { 
      font-family: 'Noto Sans TC', sans-serif; 
      font-size: 1.125rem; /* 基本字體加大 */
    }
    .correct-choice { background-color: #dcfce7 !important; border-color: #16a34a !important; color: #15803d !important; font-weight: 700 !important; }
    .wrong-choice { background-color: #fee2e2 !important; border-color: #dc2626 !important; color: #b91c1c !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-10 px-4 sm:px-6">
  <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
    
    <!-- 頁頭資訊 -->
    <header class="bg-blue-600 text-white p-8 sm:p-10">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6">
        <div>
          <span class="bg-blue-800 text-blue-200 text-sm font-bold px-4 py-1.5 rounded-full uppercase tracking-wider">Midterm Exam</span>
          <h1 class="text-3xl sm:text-4xl font-black mt-3 tracking-wide">國小五年級 英語期中能力評量</h1>
          <p class="text-blue-100 text-base sm:text-lg mt-2">範圍：Review（地點、過去式、發音、序數）與 Unit 1~2 精選 100 題</p>
        </div>
        <div class="bg-blue-500/40 px-6 py-4 rounded-2xl border border-blue-400 text-center min-w-[140px] shadow-inner">
          <div class="text-sm text-blue-100 font-medium">總題數</div>
          <div class="text-3xl sm:text-4xl font-black mt-1">100 題</div>
        </div>
      </div>

      <!-- 學生資訊填寫區 -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mt-8 pt-8 border-t border-blue-400/50">
        <div>
          <label class="block text-sm font-semibold text-blue-100 mb-2">班級</label>
          <input type="text" placeholder="例如：五年二班" class="w-full px-4 py-3 rounded-xl bg-white/10 text-white text-lg placeholder-blue-300 border border-blue-300 focus:outline-none focus:ring-2 focus:ring-white">
        </div>
        <div>
          <label class="block text-sm font-semibold text-blue-100 mb-2">座號</label>
          <input type="text" placeholder="例如：12" class="w-full px-4 py-3 rounded-xl bg-white/10 text-white text-lg placeholder-blue-300 border border-blue-300 focus:outline-none focus:ring-2 focus:ring-white">
        </div>
        <div>
          <label class="block text-sm font-semibold text-blue-100 mb-2">姓名</label>
          <input type="text" placeholder="學生姓名" class="w-full px-4 py-3 rounded-xl bg-white/10 text-white text-lg placeholder-blue-300 border border-blue-300 focus:outline-none focus:ring-2 focus:ring-white">
        </div>
      </div>
    </header>

    <!-- 成績結算看版 (輸入密碼正確後展示) -->
    <div id="scoreBoard" class="hidden bg-slate-50 border-b border-slate-200 p-8 transition-all duration-500">
      <div class="max-w-lg mx-auto bg-white rounded-2xl shadow-lg border border-slate-200 p-8 text-center">
        <h2 class="text-2xl font-bold text-slate-700">測驗成績結算</h2>
        <div class="flex items-center justify-center gap-3 my-5">
          <span id="finalScore" class="text-6xl font-black text-blue-600">0</span>
          <span class="text-slate-400 text-2xl font-bold">/ 100 分</span>
        </div>
        <div class="grid grid-cols-2 gap-4 text-base sm:text-lg font-bold pt-4 border-t border-slate-100">
          <div class="text-emerald-700 bg-emerald-50 py-3 rounded-xl border border-emerald-200">答對：<span id="correctCount" class="text-2xl">0</span> 題</div>
          <div class="text-rose-700 bg-rose-50 py-3 rounded-xl border border-rose-200">需訂正：<span id="wrongCount" class="text-2xl">0</span> 題</div>
        </div>
        <p class="text-sm sm:text-base text-slate-500 mt-4">★ 答案與考點解析已自動在下方展開，請逐題訂正檢視！</p>
      </div>
    </div>

    <!-- 試卷主容器 -->
    <main class="p-6 sm:p-10 space-y-12" id="quizContainer">
      <!-- 由 JavaScript 動態生成 100 題 -->
    </main>

    <!-- 底部操作列 -->
    <footer class="bg-slate-50 p-6 sm:p-8 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-6">
      <div class="text-base text-slate-600 flex items-center gap-2">
        <svg class="w-6 h-6 text-amber-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
        <span>交卷</span>
      </div>
      <div class="flex items-center gap-4 w-full sm:w-auto">
        <button onclick="resetExam()" class="w-1/2 sm:w-auto px-6 py-3.5 rounded-2xl border-2 border-slate-300 text-slate-700 hover:bg-slate-100 font-bold text-base transition">
          重新作答
        </button>
        <button onclick="checkPasswordAndGrade()" class="w-1/2 sm:w-auto px-8 py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-base sm:text-lg shadow-lg shadow-blue-500/30 transition">
          提交試卷並評分
        </button>
      </div>
    </footer>
  </div>

  <script>
    // 試卷 100 題題庫資料
    const questions = [
      // Part I: 單字拼寫填空 (1-20)
      { id: 1, type: "fill", q: "夜市 (n_____ m_____)", answer: "night market", explanation: "Unit 1 主題單字：night market (夜市)。" },
      { id: 2, type: "fill", q: "百貨公司 (d_____ s_____)", answer: "department store", explanation: "Unit 1 主題單字：department store (百貨公司)。" },
      { id: 3, type: "fill", q: "遊樂園 (a_____ p_____)", answer: "amusement park", explanation: "Unit 1 主題單字：amusement park (遊樂園)。" },
      { id: 4, type: "fill", q: "河濱公園 (r_____ p_____)", answer: "riverside park", explanation: "Unit 1 主題單字：riverside park (河濱公園)。" },
      { id: 5, type: "fill", q: "第十二 (序數)", answer: "twelfth", explanation: "序數 12th 拼寫為 twelfth（twelve 去掉 ve 改 f 加 th）。" },
      { id: 6, type: "fill", q: "第九 (序數)", answer: "ninth", explanation: "序數 9th 拼寫為 ninth（nine 去掉 e 加 th）。" },
      { id: 7, type: "fill", q: "第二十 (序數)", answer: "twentieth", explanation: "序數 20th 拼寫為 twentieth（twenty 去 y 改 ie 加 th）。" },
      { id: 8, type: "fill", q: "第二 (序數)", answer: "second", explanation: "序數 2nd 為 second。" },
      { id: 9, type: "fill", q: "第三 (序數)", answer: "third", explanation: "序數 3rd 為 third。" },
      { id: 10, type: "fill", q: "第一 (序數)", answer: "first", explanation: "序數 1st 為 first。" },
      { id: 11, type: "fill", q: "放風箏 (過去式動詞: f_____ a kite)", answer: "flew", explanation: "fly 的過去式為 flew。" },
      { id: 12, type: "fill", q: "喝果汁 (過去式動詞: d_____ juice)", answer: "drank", explanation: "drink 的過去式為 drank。" },
      { id: 13, type: "fill", q: "吃點心 (過去式動詞: a_____ snacks)", answer: "ate", explanation: "eat 的過去式為 ate。" },
      { id: 14, type: "fill", q: "騎腳踏車 (過去式動詞: r_____ a bike)", answer: "rode", explanation: "ride 的過去式為 rode。" },
      { id: 15, type: "fill", q: "看電影 (過去式動詞: s_____ a movie)", answer: "saw", explanation: "see 的過去式為 saw。" },
      { id: 16, type: "fill", q: "畫了一幅畫 (過去式動詞: d_____ a picture)", answer: "drew", explanation: "draw 的過去式為 drew。" },
      { id: 17, type: "fill", q: "去野餐 (過去式動詞: h_____ a picnic)", answer: "had", explanation: "have 的過去式為 had。" },
      { id: 18, type: "fill", q: "游泳 (過去式動詞: s_____)", answer: "swam", explanation: "swim 的過去式為 swam。" },
      { id: 19, type: "fill", q: "唱歌 (過去式動詞: s_____ songs)", answer: "sang", explanation: "sing 的過去式為 sang。" },
      { id: 20, type: "fill", q: "寫信 (過去式動詞: w_____ a letter)", answer: "wrote", explanation: "write 的過去式為 wrote。" },

      // Part II: 文法與字彙單選 (21-70)
      { id: 21, type: "choice", q: "Where ______ you go last weekend?", options: ["do", "did", "are", "were"], answer: "B", explanation: "last weekend 為過去時間，疑問句助動詞用 did。" },
      { id: 22, type: "choice", q: "I ______ to the riverside park yesterday.", options: ["go", "goes", "went", "going"], answer: "C", explanation: "yesterday 需使用 go 的過去式 went。" },
      { id: 23, type: "choice", q: "What ______ Gary do yesterday afternoon?", options: ["does", "did", "is", "was"], answer: "B", explanation: "yesterday afternoon 過去式問句助動詞用 did。" },
      { id: 24, type: "choice", q: "Did Gina ______ a picnic yesterday?", options: ["have", "had", "has", "having"], answer: "A", explanation: "助動詞 Did 後面動詞必須回歸原形 have。" },
      { id: 25, type: "choice", q: "No, she didn't. She ______ songs.", options: ["sing", "sings", "sang", "singing"], answer: "C", explanation: "否定回答後的補述肯定句，需用 sing 的過去式 sang。" },
      { id: 26, type: "choice", q: "The girl won ______ place in the race.", options: ["one", "first", "1", "once"], answer: "B", explanation: "得到第幾名使用序數 first place。" },
      { id: 27, type: "choice", q: "Mother's Day is on the ______ Sunday of May.", options: ["two", "second", "2", "twice"], answer: "B", explanation: "五月的第二個星期日，使用序數 second Sunday。" },
      { id: 28, type: "choice", q: "He is a ______ student.", options: ["six grade", "sixth-grade", "sixth grade", "six-grades"], answer: "B", explanation: "修飾名詞 student 作複合形容詞時用 sixth-grade。" },
      { id: 29, type: "choice", q: "The baby is their ______ child.", options: ["three", "third", "threes", "3rd of"], answer: "B", explanation: "第幾個小孩用序數 third child。" },
      { id: 30, type: "choice", q: "How much ______ the jeans?", options: ["is", "are", "do", "does"], answer: "B", explanation: "jeans（牛仔褲）為複數名詞，be 動詞用 are。" },
      { id: 31, type: "choice", q: "They ______ one hundred dollars.", options: ["is", "are", "costing", "has"], answer: "B", explanation: "代名詞 They 指代 jeans，be 動詞用 are。" },
      { id: 32, type: "choice", q: "Where ______ you yesterday?", options: ["was", "were", "are", "did"], answer: "B", explanation: "you 在過去式的 be 動詞為 were。" },
      { id: 33, type: "choice", q: "I ______ at the movie theater last night.", options: ["was", "were", "am", "did"], answer: "A", explanation: "第一人稱 I 在過去式的 be 動詞為 was。" },
      { id: 34, type: "choice", q: "We went shopping and walked a lot, so we ______ really hungry.", options: ["are", "was", "were", "did"], answer: "C", explanation: "主詞 we 在過去式的 be 動詞為 were。" },
      { id: 35, type: "choice", q: "How ______ your weekend? — It was great!", options: ["is", "was", "were", "did"], answer: "B", explanation: "詢問過去過得如何用 How was your weekend?" },
      { id: 36, type: "choice", q: "What did you do last night? — I ______ my dog.", options: ["walk", "walks", "walked", "walking"], answer: "C", explanation: "回答過去從事的活動，動詞 walk 加 ed 變 walked。" },
      { id: 37, type: "choice", q: "My brother ______ his room yesterday morning.", options: ["clean", "cleans", "cleaned", "cleaning"], answer: "C", explanation: "yesterday morning 過去式，使用 cleaned。" },
      { id: 38, type: "choice", q: "Did you ______ a letter to your teacher?", options: ["wrote", "write", "writing", "writes"], answer: "B", explanation: "Did 後面動詞用原形 write。" },
      { id: 39, type: "choice", q: "No, I didn't. I ______ a friend.", options: ["visit", "visited", "visiting", "visits"], answer: "B", explanation: "過去式肯定句，動詞用 visited。" },
      { id: 40, type: "choice", q: "He ______ a haircut yesterday.", options: ["get", "gets", "got", "gotten"], answer: "C", explanation: "get 的過去式為 got。" },
      { id: 41, type: "choice", q: "What's your favorite season? — My favorite season is ______.", options: ["cool", "fall", "wet", "dry"], answer: "B", explanation: "詢問季節（season），選項中只有 fall（秋天）是季節。" },
      { id: 42, type: "choice", q: "It's cool and ______ in fall.", options: ["coat", "dry", "shorts", "pants"], answer: "B", explanation: "秋天天氣涼爽且乾燥（dry）。" },
      { id: 43, type: "choice", q: "It's very ______ in winter. There is lots of snow.", options: ["snowy", "rain", "fog", "sun"], answer: "A", explanation: "形容詞 snowy 表示下雪的、積雪的。" },
      { id: 44, type: "choice", q: "Today is very ______; I can hardly see the buildings.", options: ["wet", "foggy", "dry", "hot"], answer: "B", explanation: "看不太清建築物表示霧很大（foggy）。" },
      { id: 45, type: "choice", q: "The early bird ______ the worm.", options: ["catch", "catches", "gets", "getting"], answer: "C", explanation: "經典名句：The early bird gets the worm. (早起的鳥兒有蟲吃)。" },
      { id: 46, type: "choice", q: "It's never too late to ______.", options: ["learn", "learned", "learning", "learns"], answer: "A", explanation: "經典名句：It's never too late to learn. (活到老學到老)。" },
      { id: 47, type: "choice", q: "Never judge a book by its ______.", options: ["title", "cover", "color", "price"], answer: "B", explanation: "經典名句：Never judge a book by its cover. (勿以貌取人)。" },
      { id: 48, type: "choice", q: "I am so hungry, I could eat a ______!", options: ["cow", "pig", "horse", "sheep"], answer: "C", explanation: "經典名句：I could eat a horse! (我餓得能吞下一匹馬)。" },
      { id: 49, type: "choice", q: "The fifth month of the year is ______.", options: ["March", "April", "May", "June"], answer: "C", explanation: "一年中的第五個月是一月起算第五個：May（五月）。" },
      { id: 50, type: "choice", q: "Which of the following is in pair? (哪一項通常成雙成對？)", options: ["a jacket", "a hat", "shorts", "a dress"], answer: "C", explanation: "shorts（短褲）有兩條褲管，恆為複數名詞。" },
      { id: 51, type: "choice", q: "Rocky and Thor ______ in Taipei last weekend.", options: ["was", "were", "did", "are"], answer: "B", explanation: "複數主詞 Rocky and Thor 在過去式的 be 動詞為 were。" },
      { id: 52, type: "choice", q: "Did Thor go to Taipei 101? — Yes, he ______.", options: ["was", "is", "did", "does"], answer: "C", explanation: "Did 開頭的問句簡答用 did。" },
      { id: 53, type: "choice", q: "Edison ______ basketball with his friends yesterday.", options: ["play", "plays", "played", "playing"], answer: "C", explanation: "過去式動詞加 ed 變 played。" },
      { id: 54, type: "choice", q: "Where ______ you at 8:00 last night?", options: ["was", "were", "are", "did"], answer: "B", explanation: "主詞 you 搭配過去式 be 動詞 were。" },
      { id: 55, type: "choice", q: "I was ______ home with my parents.", options: ["in", "on", "at", "to"], answer: "C", explanation: "在家裡的固定介系詞片語為 at home。" },
      { id: 56, type: "choice", q: "They were at the ______ to see monkeys and lions.", options: ["mall", "zoo", "theater", "school"], answer: "B", explanation: "看猴子與獅子的地方是 zoo（動物園）。" },
      { id: 57, type: "choice", q: "We were at the ______ to buy some new clothes.", options: ["zoo", "mall", "riverside", "restaurant"], answer: "B", explanation: "買新衣服的地方是 mall（購物中心/商場）。" },
      { id: 58, type: "choice", q: "They ate steak at a famous ______.", options: ["restaurant", "night market", "school", "park"], answer: "A", explanation: "吃牛排的地方是 restaurant（餐廳）。" },
      { id: 59, type: "choice", q: "He ______ a walk along the river yesterday.", options: ["take", "takes", "took", "taking"], answer: "C", explanation: "take a walk 的過去式為 took a walk。" },
      { id: 60, type: "choice", q: "What did Mia ______ yesterday? — She drew a picture.", options: ["do", "did", "does", "doing"], answer: "A", explanation: "疑問句助動詞 did 後面動詞用原形 do。" },
      { id: 61, type: "choice", q: "Did Edison fly a kite? — No, he ______.", options: ["did", "didn't", "wasn't", "doesn't"], answer: "B", explanation: "Did 問句的否定簡答為 didn't。" },
      { id: 62, type: "choice", q: "Amber ______ shopping with Thor last Saturday.", options: ["go", "goes", "went", "going"], answer: "C", explanation: "過去時間 last Saturday 動詞用 went。" },
      { id: 63, type: "choice", q: "Gary ______ fast in the race and won.", options: ["run", "ran", "runs", "running"], answer: "B", explanation: "run 的過去式為 ran。" },
      { id: 64, type: "choice", q: "Did she ______ a haircut? — Yes, she did.", options: ["get", "got", "gets", "getting"], answer: "A", explanation: "助動詞 Did 後接原形動詞 get。" },
      { id: 65, type: "choice", q: "Tomorrow is December ______. (第十二天)", options: ["12th", "12st", "12nd", "12rd"], answer: "A", explanation: "12 的序數字尾是 th (12th)。" },
      { id: 66, type: "choice", q: "May is the ______ month of the year.", options: ["5th", "5st", "5nd", "5rd"], answer: "A", explanation: "序數 5th 為 fifth。" },
      { id: 67, type: "choice", q: "Look at the runner in front! He is in ______ place.", options: ["1st", "1th", "1nd", "1rd"], answer: "A", explanation: "第一名的序數簡寫是 1st。" },
      { id: 68, type: "choice", q: "She is the ______ child in her family. (第三個)", options: ["3th", "3rd", "3st", "3nd"], answer: "B", explanation: "第三的序數簡寫是 3rd。" },
      { id: 69, type: "choice", q: "What did you do? — I ______ snacks at the night market.", options: ["eat", "ate", "eats", "eating"], answer: "B", explanation: "問句用 did，回答需用過去式 ate。" },
      { id: 70, type: "choice", q: "Did you drink juice? — Yes, I ______ orange juice.", options: ["drink", "drank", "drinks", "drinking"], answer: "B", explanation: "過去式肯定句動詞用 drank。" },

      // Part III: 情境對話理解 (71-80)
      { id: 71, type: "choice", q: "A: How was your weekend? — B: ______", options: ["I went to Taipei.", "It was great!", "I ate snacks.", "Yes, it did."], answer: "B", explanation: "詢問週末過得如何，回答感受「It was great!」最恰當。" },
      { id: 72, type: "choice", q: "A: Where did you go last Sunday? — B: ______", options: ["I went to the amusement park.", "I rode a bike.", "It is sunny.", "Yes, I was."], answer: "A", explanation: "Where 詢問地點，回答「I went to the amusement park.」。" },
      { id: 73, type: "choice", q: "A: What did you do at the park? — B: ______", options: ["I was happy.", "I flew a kite.", "At the park.", "No, I didn't."], answer: "B", explanation: "What did you do 詢問從事的活動，回答「I flew a kite.」。" },
      { id: 74, type: "choice", q: "A: Did you have a picnic yesterday? — B: No, I didn't. ______", options: ["I had a picnic.", "I drew a picture.", "Yes, I did.", "I am at home."], answer: "B", explanation: "否定回答後說明實際做的事情：「I drew a picture.」。" },
      { id: 75, type: "choice", q: "A: How much are the pants? — B: ______", options: ["It's fifty dollars.", "They are fifty dollars.", "They are blue.", "Yes, they are."], answer: "B", explanation: "pants 為複數，回答價錢用「They are fifty dollars.」。" },
      { id: 76, type: "choice", q: "A: What's your favorite season? — B: ______", options: ["I like spring.", "It's cool today.", "It's rainy.", "I have a coat."], answer: "A", explanation: "詢問最喜愛的季節，回答「I like spring.」。" },
      { id: 77, type: "choice", q: "A: Did Gina swim yesterday? — B: Yes, she did. ______", options: ["She sang songs.", "She swam in the pool.", "She didn't swim.", "She ran fast."], answer: "B", explanation: "肯定回答後補充游泳地點：「She swam in the pool.」。" },
      { id: 78, type: "choice", q: "A: Where were you yesterday afternoon? — B: ______", options: ["I was at the department store.", "I bought a hat.", "I am at school.", "Yes, I was."], answer: "A", explanation: "Where were you 詢問過去人在哪裡，回答「I was at the department store.」。" },
      { id: 79, type: "choice", q: "A: What did you do last night? — B: ______", options: ["I watched videos.", "I am watching TV.", "It's cold.", "At home."], answer: "A", explanation: "詢問昨晚做的事，用過去式「I watched videos.」。" },
      { id: 80, type: "choice", q: "A: Why are you so hungry? — B: ______", options: ["Because we walked a lot today.", "Because it's sunny.", "Because I am at the zoo.", "No, I'm not."], answer: "A", explanation: "詢問原因，回答走很多路所以很餓。" },

      // Part IV: 自然發音與母音辨析 (81-90)
      { id: 81, type: "choice", q: "Which word starts with the 'pl' sound?", options: ["planet", "black", "clap", "glad"], answer: "A", explanation: "planet 的開頭混合音為 pl。" },

    // 動態渲染試卷題目
    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      let html = '';

      // 大題分類呈現
      const sections = [
        { title: "Part I: 單字拼寫填空題 (1 ~ 20 題)", desc: "請依中文提示與提示字母，拼出正確的英語單字或動詞過去式（請注意拼字完整度）", start: 1, end: 20 },
        { title: "Part II: 文法、字彙與句型單選題 (21 ~ 70 題)", desc: "請選出一個最正確、最適當的選項代號", start: 21, end: 70 },
        { title: "Part III: 日常情境對話理解 (71 ~ 80 題)", desc: "請依前後文語境，選出最恰當的生活會話回應", start: 71, end: 80 },
        { title: "Part IV: 自然發音、母音與常用語辨析 (81 ~ 90 題)", desc: "請依發音規則與語境邏輯，選出最相符的答案", start: 81, end: 90 },
        { title: "Part V: 故事閱讀與情境理解 (91 ~ 100 題)", desc: "請依 Unit 1~2 課文情境故事與角色背景，回答下列問題", start: 91, end: 100 }
      ];

      sections.forEach(sec => {
        html += `
          <div class="border-b-2 border-slate-200 pb-4">
            <h2 class="text-2xl sm:text-3xl font-black text-slate-800">${sec.title}</h2>
            <p class="text-slate-500 text-base sm:text-lg mt-2">${sec.desc}</p>
          </div>
          <div class="grid grid-cols-1 gap-6">
        `;

        const secQuestions = questions.filter(item => item.id >= sec.start && item.id <= sec.end);
        secQuestions.forEach(item => {
          html += `
            <div id="card-${item.id}" class="bg-white rounded-2xl border-2 border-slate-200 p-6 sm:p-7 shadow-sm transition hover:border-slate-300">
              <div class="flex items-start justify-between gap-4 mb-4">
                <span class="inline-flex items-center px-4 py-1.5 rounded-xl text-base font-extrabold bg-blue-50 text-blue-700 border border-blue-200">
                  第 ${item.id} 題
                </span>
                <span id="badge-${item.id}" class="hidden text-base font-extrabold px-3 py-1 rounded-lg"></span>
              </div>
              <p class="text-lg sm:text-xl font-bold text-slate-800 whitespace-pre-line leading-relaxed mb-5">${item.q}</p>
          `;

          if (item.type === "fill") {
            html += `
              <div class="mt-3">
                <input type="text" id="input-${item.id}" placeholder="請在此輸入英文單字..." class="w-full sm:w-2/3 px-5 py-3.5 text-lg sm:text-xl rounded-xl border-2 border-slate-300 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition">
              </div>
            `;
          } else if (item.type === "choice") {
            html += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">`;
            const letters = ["A", "B", "C", "D"];
            item.options.forEach((opt, idx) => {
              const letter = letters[idx];
              html += `
                <label id="opt-label-${item.id}-${letter}" class="flex items-center gap-3.5 p-4 rounded-xl border-2 border-slate-200 hover:bg-slate-50 cursor-pointer transition text-base sm:text-lg">
                  <input type="radio" name="q-${item.id}" value="${letter}" class="w-5 h-5 text-blue-600 focus:ring-blue-500">
                  <span class="font-extrabold text-blue-600">${letter}.</span>
                  <span class="font-medium text-slate-700">${opt}</span>
                </label>
              `;
            });
            html += `</div>`;
          }

          // 答案與解析反饋框（評分後展開）
          html += `
              <div id="feedback-${item.id}" class="hidden mt-6 pt-5 border-t-2 border-dashed border-slate-200 text-base sm:text-lg">
                <div class="font-bold text-slate-700 mb-2">
                  你的作答：<span id="user-ans-${item.id}" class="font-bold"></span> 
                  <span class="mx-2 text-slate-300">|</span> 
                  標準答案：<span id="correct-ans-${item.id}" class="text-emerald-700 font-extrabold"></span>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-slate-600 leading-relaxed">
                  <span class="font-extrabold text-blue-600">考點解析：</span>${item.explanation}
                </div>
              </div>
            </div>
          `;
        });

        html += `</div>`;
      });

      container.innerHTML = html;
    }

    // 密碼保護驗證並評分
    function checkPasswordAndGrade() {
      const pwd = prompt("請輸入對答案密碼 (Password)：");
      if (pwd === null) {
        return; // 使用者按取消
      }
      if (pwd.trim() !== "0216") {
        alert("密碼錯誤！請輸入正確的 4 位數密碼以解鎖答案。");
        return;
      }
      gradeExam();
    }

    // 自動計分與對答案邏輯
    function gradeExam() {
      let score = 0;
      let correct = 0;
      let wrong = 0;

      questions.forEach(item => {
        let userAns = "";
        let isCorrect = false;
        const feedbackBox = document.getElementById(`feedback-${item.id}`);
        const userAnsSpan = document.getElementById(`user-ans-${item.id}`);
        const correctAnsSpan = document.getElementById(`correct-ans-${item.id}`);
        const badge = document.getElementById(`badge-${item.id}`);
        const card = document.getElementById(`card-${item.id}`);

        if (item.type === "fill") {
          const inputEl = document.getElementById(`input-${item.id}`);
          userAns = inputEl.value.trim();
          // 比對答案（忽略大小寫）
          if (userAns.toLowerCase() === item.answer.toLowerCase()) {
            isCorrect = true;
          }
          userAnsSpan.innerText = userAns ? userAns : "(未作答)";
          correctAnsSpan.innerText = item.answer;
        } else if (item.type === "choice") {
          const checked = document.querySelector(`input[name="q-${item.id}"]:checked`);
          userAns = checked ? checked.value : "";
          if (userAns === item.answer) {
            isCorrect = true;
          }
          userAnsSpan.innerText = userAns ? userAns : "(未作答)";
          correctAnsSpan.innerText = item.answer;

          // 標記選項顏色
          const letters = ["A", "B", "C", "D"];
          letters.forEach(letter => {
            const labelEl = document.getElementById(`opt-label-${item.id}-${letter}`);
            if (letter === item.answer) {
              labelEl.classList.add("correct-choice");
            } else if (letter === userAns && !isCorrect) {
              labelEl.classList.add("wrong-choice");
            }
          });
        }

        feedbackBox.classList.remove("hidden");
        badge.classList.remove("hidden");

        if (isCorrect) {
          score += 1;
          correct += 1;
          badge.innerText = "✓ 答對";
          badge.className = "text-base font-extrabold px-3 py-1 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-300";
          card.classList.add("border-emerald-300", "bg-emerald-50/20");
        } else {
          wrong += 1;
          badge.innerText = "✗ 需訂正";
          badge.className = "text-base font-extrabold px-3 py-1 rounded-lg bg-rose-100 text-rose-800 border border-rose-300";
          card.classList.add("border-rose-300", "bg-rose-50/20");
        }
      });

      // 呈現成績看板
      document.getElementById("finalScore").innerText = score;
      document.getElementById("correctCount").innerText = correct;
      document.getElementById("wrongCount").innerText = wrong;
      
      const scoreBoard = document.getElementById("scoreBoard");
      scoreBoard.classList.remove("hidden");
      scoreBoard.scrollIntoView({ behavior: 'smooth' });
    }

    // 重新作答
    function resetExam() {
      if (confirm("確定要清除所有作答紀錄並重新測驗嗎？")) {
        renderQuiz();
        document.getElementById("scoreBoard").classList.add("hidden");
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // 初始化渲染
    window.onload = renderQuiz;
  </script>
</body>
